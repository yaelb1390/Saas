<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#4f46e5">
    <title>Sin conexión · BM Business OS</title>
    <!--
        Página de resguardo del service worker: se sirve cuando una pantalla del panel no se puede
        abrir porque no hay red. Autocontenida a propósito (CSS en línea, sin /build/ ni fuentes):
        tiene que poder pintarse sin pedir nada más, porque justo no hay con qué pedirlo.
        No muestra datos: el panel nunca enseña cifras guardadas fuera del mostrador.
    -->
    <style>
        :root {
            --fondo: #f4f6fb; --tarjeta: #ffffff; --texto: #1e293b; --suave: #64748b;
            --borde: #e2e8f0; --marca: #4f46e5; --marca-texto: #ffffff;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --fondo: #0f172a; --tarjeta: #1e293b; --texto: #f1f5f9; --suave: #94a3b8;
                --borde: #334155; --marca: #6366f1; --marca-texto: #ffffff;
            }
        }
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
            padding: 16px; background: var(--fondo); color: var(--texto);
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }
        .tarjeta {
            width: 100%; max-width: 420px; padding: 32px 24px; text-align: center;
            background: var(--tarjeta); border: 1px solid var(--borde); border-radius: 16px;
        }
        .icono { width: 48px; height: 48px; margin: 0 auto 16px; color: var(--suave); }
        h1 { margin: 0 0 8px; font-size: 1.25rem; }
        p { margin: 0 0 20px; color: var(--suave); font-size: 0.95rem; line-height: 1.5; }
        .acciones { display: flex; flex-direction: column; gap: 8px; }
        .btn {
            display: block; padding: 12px 16px; border-radius: 10px; font-size: 0.95rem;
            font-weight: 600; text-decoration: none; cursor: pointer; border: 1px solid var(--borde);
            background: transparent; color: var(--texto);
        }
        .btn-primario { background: var(--marca); color: var(--marca-texto); border-color: var(--marca); }
        .nota { margin: 16px 0 0; font-size: 0.8rem; }
    </style>
</head>
<body>
    <main class="tarjeta">
        <svg class="icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="m3 3 18 18M8.288 15.038a5.25 5.25 0 0 1 7.424 0M5.106 11.856a9.75 9.75 0 0 1 3.33-2.142m5.243-.62a9.735 9.735 0 0 1 5.215 2.762M1.924 8.674a14.25 14.25 0 0 1 5.07-3.19m4.006-.735a14.25 14.25 0 0 1 11.076 3.925M12 18.75h.008v.008H12v-.008Z"/>
        </svg>
        <h1>Sin conexión a internet</h1>
        <p>Esta pantalla necesita conexión para mostrarte datos al día. Vuelve a intentarlo cuando regrese la señal.</p>
        <div class="acciones">
            <button type="button" class="btn btn-primario" onclick="location.reload()">Reintentar</button>
            <a class="btn" href="/panel/pos-rapido">Ir a Venta rápida</a>
            <a class="btn" href="/panel/pos">Ir al Punto de venta</a>
        </div>
        <p class="nota">Las pantallas de cobro funcionan sin conexión si ya se abrieron antes en este equipo.</p>
    </main>
    <script>
        // Al volver la red, se reintenta solo: el cajero no tiene que acordarse de pulsar nada.
        window.addEventListener('online', () => location.reload());
    </script>
</body>
</html>
